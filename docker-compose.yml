name: system-design-lab

# Everything runs locally in Docker, so it is free. The passwords below are lab-only
# defaults for containers that never leave your machine. Copy .env.example to .env
# to override them. Published ports bind to 127.0.0.1 only.

x-py-env: &py-env
  PRIMARY_DSN: postgresql://postgres:${LAB_DB_PASSWORD:-lab_db_password_change_me}@pg-primary:5432/lab
  REPLICA_DSN: postgresql://postgres:${LAB_DB_PASSWORD:-lab_db_password_change_me}@pg-replica:5432/lab
  SHARD_DSNS: postgresql://postgres:${LAB_DB_PASSWORD:-lab_db_password_change_me}@pg-shard0:5432/lab,postgresql://postgres:${LAB_DB_PASSWORD:-lab_db_password_change_me}@pg-shard1:5432/lab
  REDIS_URL: redis://redis:6379/0
  RABBIT_URL: amqp://lab:${LAB_MQ_PASSWORD:-lab_mq_password_change_me}@rabbitmq:5672/
  CACHE_TTL: "30"
  SHARD_STRATEGY: ${SHARD_STRATEGY:-ring}
  PROCESS_MS: ${PROCESS_MS:-300}

x-py-depends: &py-depends
  pg-primary: { condition: service_healthy }
  pg-replica: { condition: service_healthy }
  pg-shard0: { condition: service_healthy }
  pg-shard1: { condition: service_healthy }
  redis: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }

x-api: &api
  build: ./services/py
  image: sdl-py:latest
  command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  environment: *py-env
  depends_on: *py-depends
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  # ---------- Databases ----------
  pg-primary:
    image: postgres:16
    hostname: pg-primary
    environment:
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab_db_password_change_me}
      POSTGRES_DB: lab
      REPLICATION_PASSWORD: ${LAB_REPL_PASSWORD:-lab_repl_password_change_me}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "listen_addresses=*"]
    volumes:
      - ./db/primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
      - pg-primary-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  pg-replica:
    image: postgres:16
    hostname: pg-replica
    depends_on:
      pg-primary: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab_db_password_change_me}
      REPLICATION_PASSWORD: ${LAB_REPL_PASSWORD:-lab_repl_password_change_me}
      PRIMARY_HOST: pg-primary
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    volumes:
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - pg-replica-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 3s
      timeout: 3s
      retries: 30

  pg-shard0:
    image: postgres:16-alpine
    hostname: pg-shard0
    environment:
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab_db_password_change_me}
      POSTGRES_DB: lab
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  pg-shard1:
    image: postgres:16-alpine
    hostname: pg-shard1
    environment:
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab_db_password_change_me}
      POSTGRES_DB: lab
    ports: ["127.0.0.1:5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------- Cache ----------
  redis:
    image: redis:7-alpine
    hostname: redis
    # Small memory cap + LRU eviction so you can watch eviction behave like a real cache.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------- Message queue ----------
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: ${LAB_MQ_PASSWORD:-lab_mq_password_change_me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- App servers (three identical instances behind the load balancer) ----------
  api1:
    <<: *api
    hostname: api1
  api2:
    <<: *api
    hostname: api2
  api3:
    <<: *api
    hostname: api3

  # Scale me: docker compose up -d --scale worker=3
  worker:
    image: sdl-py:latest
    command: ["python", "worker.py"]
    environment: *py-env
    depends_on:
      api1: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # ---------- Load balancer (nginx) ----------
  lb:
    image: nginx:1.27-alpine
    hostname: lb
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
      api3: { condition: service_healthy }
    # Swap algorithms: LB_CONF=lb.least_conn.conf docker compose up -d lb
    volumes:
      - ./nginx/${LB_CONF:-lb.round_robin.conf}:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8081:80"]

  # ---------- CDN (nginx caching reverse proxy in front of the load balancer) ----------
  cdn:
    image: nginx:1.27-alpine
    hostname: cdn
    depends_on: [lb]
    volumes:
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8082:80"]

  # ---------- API gateway (TypeScript) ----------
  gateway:
    build: ./gateway
    hostname: gateway
    depends_on:
      lb: { condition: service_started }
      redis: { condition: service_healthy }
    environment:
      UPSTREAM: http://lb
      REDIS_URL: redis://redis:6379/0
      # key:bucketCapacity:refillPerSecond. Demo keys, not secrets.
      API_KEYS: ${LAB_API_KEYS:-free-key:5:1,pro-key:50:10}
    ports: ["127.0.0.1:8080:3000"]

volumes:
  pg-primary-data:
  pg-replica-data:
