# Load balancer: round robin (nginx default). Requests rotate api1 -> api2 -> api3.
upstream api_pool {
    server api1:8000 max_fails=2 fail_timeout=10s;
    server api2:8000 max_fails=2 fail_timeout=10s;
    server api3:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_pool;
        # If a backend errors or times out, quietly retry on another one.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-LB "nginx-round-robin" always;
    }
}
