# A tiny CDN edge: a caching reverse proxy in front of the "origin" (our load balancer).
# Real CDNs (Cloudflare, CloudFront, Fastly) do the same thing at hundreds of locations.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen 80;

    location /assets/ {
        proxy_pass http://lb:80;
        proxy_cache cdn;
        # Fallback TTL. The origin's Cache-Control header wins when present.
        proxy_cache_valid 200 60s;
        # Request collapsing: if 100 users ask for an uncached file at once, only one
        # request goes to the origin; the rest wait for it. This prevents a stampede.
        proxy_cache_lock on;
        # If the origin is down, keep serving the stale copy.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
