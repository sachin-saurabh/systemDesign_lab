# Load balancer: IP hash (sticky sessions). The same client IP always lands on the same
# backend. Useful when servers keep per-user state in memory; bad for even distribution.
upstream api_pool {
    ip_hash;
    server api1:8000 max_fails=2 fail_timeout=10s;
    server api2:8000 max_fails=2 fail_timeout=10s;
    server api3:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_pool;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-LB "nginx-ip-hash" always;
    }
}
