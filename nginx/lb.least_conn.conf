# Load balancer: least connections. Each request goes to the backend with the fewest
# in-flight requests. Better than round robin when request costs vary a lot.
upstream api_pool {
    least_conn;
    server api1:8000 max_fails=2 fail_timeout=10s;
    server api2:8000 max_fails=2 fail_timeout=10s;
    server api3:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_pool;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-LB "nginx-least-conn" always;
    }
}
